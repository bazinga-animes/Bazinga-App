name: Gerar APK Bazinga Animes
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar estrutura Android
        run: flutter create --platforms=android --project-name bazinga_animes --org com.bazingaanimes .
      - name: Permitir acesso a internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest ', 1).replace('>', '>\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          s = s.replace('android:label="bazinga_animes"', 'android:label="Bazinga Animes"')
          p.write_text(s)
          PY
      - name: Baixar dependencias
        run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bazinga-Animes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

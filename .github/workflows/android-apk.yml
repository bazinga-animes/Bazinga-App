name: Gerar APK Bazinga Animes

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Criar estrutura Android
        run: flutter create --platforms=android --project-name bazinga_animes --org com.bazingaanimes .

      - name: Remover teste padrão
        run: rm -f test/widget_test.dart

      - name: Configurar manifesto (internet e AdMob)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'<application\b', perm + '\n    <application', s, count=1)
          app_id = ('<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" '
                    'android:value="ca-app-pub-7102905249789565~8127679017" />')
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>', '    ' + app_id + '\n    </application>', 1)
          s = s.replace('android:label="bazinga_animes"', 'android:label="Bazinga Animes"')
          p.write_text(s)

          # Validação: o ID do AdMob precisa estar DENTRO de <application>.
          import xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(p).getroot()
          app = root.find('application')
          names = [m.get(ns + 'name') for m in app.findall('meta-data')]
          assert 'com.google.android.gms.ads.APPLICATION_ID' in names, names
          perms = [u.get(ns + 'name') for u in root.findall('uses-permission')]
          assert 'android.permission.INTERNET' in perms, perms
          print('Manifesto OK')
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink

      - name: Compilar APK debug (para diagnóstico)
        run: flutter build apk --debug

      - name: Disponibilizar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Bazinga-Animes-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

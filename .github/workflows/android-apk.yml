name: Gerar APK Bazinga Animes

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Criar estrutura Android
        run: flutter create --platforms=android --project-name bazinga_animes --org com.bazingaanimes .

      - name: Remover teste padrão
        run: rm -f test/widget_test.dart

      - name: Permitir internet e nomear o app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'<application\b', perm + '\n    <application', s, count=1)
          s = s.replace('android:label="bazinga_animes"', 'android:label="Bazinga Animes"')
          p.write_text(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink

      - name: Compilar APK debug (para diagnóstico)
        run: flutter build apk --debug

      - name: Disponibilizar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Bazinga-Animes-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
